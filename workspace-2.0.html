<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作空间 2.0</title>
  <style>
    html, body, iframe {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      overflow: hidden;
      background: #f4f6f9;
    }
  </style>
</head>
<body>
  <iframe id="workspace" src="index.html" title="工作空间 2.0"></iframe>
  <script>
    const retainedPages = new Set([
      "boardPage",
      "unitSwimlanePage"
    ]);

    document.querySelector("#workspace").addEventListener("load", event => {
      const app = event.currentTarget.contentDocument;
      app.title = "工作空间 2.0";

      app.querySelectorAll(".tabs .tab").forEach(tab => {
        if (!retainedPages.has(tab.dataset.page)) {
          tab.hidden = true;
          tab.style.setProperty("display", "none", "important");
        }
      });

      app.querySelectorAll(".page").forEach(page => {
        if (!retainedPages.has(page.id)) page.style.setProperty("display", "none", "important");
      });
    });
  </script>
</body>
</html>
